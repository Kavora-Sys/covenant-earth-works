# Covenant Earth Works — Netlify config
# Static site, no build step. The directory structure already produces clean URLs
# (/services/ serves site/services/index.html), so no rewrite rules are needed.

[build]
  publish = "site"
  command = ""

# ------------------------------------------------------------------
# Redirects
# Anything that ever linked the old .html paths, plus a safety net for
# common index.html variations. All permanent.
# ------------------------------------------------------------------
[[redirects]]
  from = "/services.html"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/projects.html"
  to = "/projects/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/safety.html"
  to = "/safety/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# ------------------------------------------------------------------
# Security headers
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Filenames are content-hashed by convention in future; safe to cache hard for now.
    Cache-Control = "public, max-age=604800"

# ------------------------------------------------------------------
# Forms
# The quote form carries name="quote-request" data-netlify="true" plus a
# honeypot field, so Netlify registers it automatically at deploy time.
# Submissions appear in the Netlify dashboard under Forms.
# ------------------------------------------------------------------